[project]
name = "mark2down"
version = "1.0.0"
description = "Automatic URL, document, and stdin to LLM-ready HTML/Markdown converter with OCR and metadata"
requires-python = ">=3.11"
authors = [{ name = "mark2down" }]
license = { text = "MIT" }
dependencies = [
    "cloakbrowser>=0.3.26",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "trafilatura>=2.0.0",
    "markdownify>=0.14.1",
    "pyyaml>=6.0.2",
    "click>=8.1.8",
    "rich>=13.9.0",
    "python-slugify>=8.0.4",
    "python-dateutil>=2.9.0",
    "charset-normalizer>=3.4.0",
    "mammoth>=1.8.0",
    "openpyxl>=3.1.5",
    "pdfminer.six>=20240706",
    "pdfplumber>=0.11.7",
    "python-pptx>=1.0.2",
    "ocrmac>=1.0.1; sys_platform == 'darwin'",
]

[project.scripts]
mark2down = "mark2down.cli:main"
m2d = "mark2down.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mark2down"]
