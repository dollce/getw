[project]
name = "getw"
version = "2.0.0"
description = "Web pages to source-grounded, LLM-ready semantic documents"
requires-python = ">=3.11"
authors = [{ name = "getw" }]
license = { text = "MIT" }
dependencies = [
    "charset-normalizer>=3.4.0,<4",
    "httpx>=0.28.1,<1",
    "lxml>=5.3.0,<7",
    "trafilatura>=2.1.0,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.52.0,<2"]
semantic = ["langextract>=1.6.0,<2"]
test = ["pytest>=8.4.0,<10"]

[project.scripts]
getw = "getw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/getw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: uses a locally installed browser through Playwright",
]
