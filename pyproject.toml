[project]
name = "mark2down"
version = "0.1.0"
description = "Agent-browser based webpage to clean Markdown converter with YAML frontmatter for training data"
requires-python = ">=3.11"
authors = [{ name = "mark2down" }]
license = { text = "MIT" }
dependencies = [
    "playwright>=1.49.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "trafilatura>=2.0.0",
    "markdownify>=0.14.1",
    "pyyaml>=6.0.2",
    "click>=8.1.8",
    "rich>=13.9.0",
    "python-slugify>=8.0.4",
    "python-dateutil>=2.9.0",
    "charset-normalizer>=3.4.0",
]

[project.scripts]
mark2down = "mark2down.cli:main"
m2d = "mark2down.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mark2down"]
